<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Admin - Tapioca da Mimi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header>
    <h1>Painel Administrativo</h1>
    <p>Gerencie os produtos e adicionais</p>
  </header>

  <!-- Cadastro de Produtos -->
  <section>
    <h2>Cadastrar Produto</h2>
    <form id="form-produto">
      <label>Nome: <input type="text" id="nome" required></label>
      <label>Preço: <input type="text" id="preco" required></label>
      <label>Imagem (URL): <input type="text" id="imagem" required></label>
      <label>Mensagem WhatsApp: <input type="text" id="mensagem" required></label>
      <button type="submit">Adicionar Produto</button>
    </form>
  </section>

  <!-- Lista de Produtos -->
  <section>
    <h2>Produtos Cadastrados</h2>
    <div id="produtos"></div>
  </section>

  <!-- Cadastro de Adicionais -->
  <section>
    <h2>Cadastrar Adicional</h2>
    <form id="form-adicional">
      <label>Nome: <input type="text" id="nome-adicional" required></label>
      <label>Preço: <input type="text" id="preco-adicional" required></label>
      <button type="submit">Adicionar Adicional</button>
    </form>
  </section>

  <!-- Lista de Adicionais -->
  <section>
    <h2>Adicionais Cadastrados</h2>
    <div id="adicionais"></div>
  </section>

  <!-- Exportar JSON -->
  <section>
    <button id="exportar-json">Exportar JSON</button>
    <pre id="json-preview"></pre>
  </section>

  <!-- Modal de Pedido (para testes de visualização) -->
  <div class="modal">
    <div class="modal-content">
      <!-- O script.js injeta conteúdo aqui -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
