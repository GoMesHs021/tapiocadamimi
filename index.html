<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tapioca da Mimi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header>
    <h1>Tapioca da Mimi</h1>
    <p>Delícias de Tapioca</p>
  </header>

  <!-- Perfil -->
  <section id="perfil">
    <img src="perfil.jpg" alt="Perfil">
    <div class="info-perfil">
      <h2>Bem-vindo à Tapioca da Mimi!</h2>
      <p>Rio das Pedras - RJ</p>
      <p>Horário: 8:00 às 14:00</p>
      <p>Delícias de Tapioca feitas com carinho</p>
    </div>
  </section>

  <!-- Lista de Produtos -->
  <section id="produtos"></section>

  <!-- Área de Adicionais (Admin) -->
  <section id="adicionais"></section>

  <!-- Formulário de Pedido (Admin) -->
  <section id="form-pedido" class="hidden"></section>

  <!-- Modal de Pedido (Clientes) -->
<div class="modal">
  <div class="modal-content">
    <span id="fechar-modal">&times;</span>
    <div id="detalhes-produto">
      <!-- O script.js injeta aqui os detalhes do produto -->
    </div>
    <form id="form-pedido">
      <h2>Finalizar Pedido</h2>

      <h3>Adicionais</h3>
      <div id="lista-adicionais">
        <!-- checkboxes injetados pelo script.js -->
      </div>

      <h3>Forma de pagamento</h3>
      <select id="pagamento">
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão">Cartão</option>
      </select>

      <h3>Precisa de troco?</h3>
      <select id="troco">
        <option value="Não">Não</option>
        <option value="Sim">Sim</option>
      </select>

      <h3>Endereço de entrega</h3>
      <input type="text" id="endereco" placeholder="Rua e número" required>

      <h3>Seu WhatsApp</h3>
      <input type="text" id="whatsapp" placeholder="(DDD) 99999-9999" required>

      <button id="finalizar-pedido">Finalizar Pedido</button>
    </form>
  </div>
</div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
